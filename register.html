<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - TTGSHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html"><span class="logo-red">TTG</span><span class="logo-dark">SHOP</span></a>
            </div>
            <nav class="nav">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="cart.html">Giỏ hàng</a>
                <a href="login.html">Đăng nhập</a>
            </nav>
            <a href="cart.html" class="cart-icon-wrapper">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="container" style="margin-top: 50px; margin-bottom: 50px;">
        <div class="auth-box">
            <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
                <form action="login.html">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Nhập email" required>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="btn">Đăng Ký</button>
                </form>
            <div class="auth-redirect">
                <p>Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></p>
            </div>
        </div>
    </main>

    <script src="products.js"></script>
    <script src="cart.js"></script>
</body>
</html>
